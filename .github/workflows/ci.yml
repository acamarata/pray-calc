name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test test.mjs
      - run: node --test test-cjs.cjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Coverage
        run: pnpm run coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  pack-check:
    name: Pack Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify pack contents
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          grep "dist/index.cjs" pack-output.txt
          grep "dist/index.mjs" pack-output.txt
          grep "dist/index.d.ts" pack-output.txt
          grep "dist/index.d.mts" pack-output.txt
          grep "README.md" pack-output.txt
          grep "CHANGELOG.md" pack-output.txt
          grep "LICENSE" pack-output.txt
          echo "Pack check passed"

  # ───────────────────────────────────────────────────────────────────────────
  # Hostile-timezone matrix.
  #
  # Three real bugs shipped in pray-calc 2.4.0's predecessor while its suite was
  # green at 134/135. They shipped because every suite ran in exactly one
  # timezone, on machines west of UTC. No amount of care in review substitutes
  # for running the tests somewhere else.
  #
  # The zones are chosen so each catches something the others cannot:
  #   UTC                 control
  #   America/New_York    west of UTC, observes DST
  #   Asia/Tokyo          east of UTC, no DST
  #   Pacific/Kiritimati  UTC+14 — the extreme that broke a seasonal index
  #   Etc/GMT+12          UTC-12 — the opposite extreme
  #   Pacific/Auckland    southern-hemisphere DST, catches transition bugs
  # ───────────────────────────────────────────────────────────────────────────
  timezones:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - America/New_York
          - Asia/Tokyo
          - Pacific/Kiritimati
          - Etc/GMT+12
          - Pacific/Auckland
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Confirm the runner is actually in the matrix zone
        run: |
          echo "TZ=$TZ"
          node -e "const z=Intl.DateTimeFormat().resolvedOptions().timeZone; console.log('resolved:', z); if (z !== process.env.TZ) { console.error('runner did not adopt TZ'); process.exit(1); }"
      - run: node --test test.mjs
      - run: node --test test-cjs.cjs
